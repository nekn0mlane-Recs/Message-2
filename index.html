const HER_NAME="Riza, my Favorite Vice";

const chapters=[
{e:"Before anything else",t:`Hey, ${HER_NAME}…`,l:["I made this because some feelings deserve more than a hurried message.","There is something I have been trying to say—honestly, gently, and without hiding behind fear."],b:"Walk with me"},
{e:"Chapter one · Us",t:"Somewhere along the way…",l:["Our ordinary conversations stopped feeling ordinary to me.","Your presence became something I looked forward to. Your happiness began to matter to me. And without planning it, the word ‘us’ started living quietly in my thoughts."],b:"There’s more"},
{e:"Chapter two · The quiet truth",t:"I know you’ve been wondering.",l:["You may be asking what is happening between us. The truth is, I have been wondering too—probably more than I know how to explain.","If I sometimes seem uncertain or distant, it is not because I do not want you. It is because what I feel is real enough to scare me."],b:"Let me be honest"},
{e:"Chapter three · The scary part",t:"Yes, I am afraid.",l:["I am scared of making mistakes. I am scared that I will not always know the right thing to say or do.","Commitment means placing something precious in another person’s hands. It means being vulnerable—and that is something I am still learning how to do."],b:"But fear isn’t the ending"},
{e:"Chapter four · My choice",t:"Even with that fear, I am willing.",l:["I am willing to try. To communicate. To grow with you.","I am willing to choose you—not only when everything feels exciting and easy, but also when things become confusing, uncertain, or difficult.","I cannot promise perfection. But I can promise honesty, effort, and that I will never treat your feelings like a game."],b:"One last page"},
{e:"The page I hope we write together",t:"So, what is happening to us?",l:["Maybe we are standing at the beginning of something beautiful.","I am scared—but I am here. I am uncertain—but I am sincere. And if you will let me, I want to discover where this ‘us’ can go.","You do not need to answer everything today. I only want you to know that you matter to me—more than you probably realize."],b:"Open my heart"}];

function tone(n,d=.7,v=.018,type="sine"){if(!sound)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audioCtx=audioCtx||new A;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=n;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(v,audioCtx.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.03)}
function chime(n=523){tone(n,.5,.05)}
function musicBeat(){const melody=[261.63,329.63,392,329.63,293.66,349.23,440,349.23,261.63,329.63,392,493.88,440,392,329.63,293.66];const bass=[130.81,130.81,146.83,146.83,130.81,130.81,146.83,146.83];tone(melody[musicStep%melody.length],1.15,.014,"sine");if(musicStep%2===0)tone(bass[Math.floor(musicStep/2)%bass.length],1.8,.009,"triangle");musicStep++}
function startMusic(){const music=document.getElementById("bgMusic");music.volume=.58;music.play().catch(()=>{})}
function toggleSound(){const music=document.getElementById("bgMusic");sound=!sound;if(sound)music.play().catch(()=>{});else music.pause();render()}
function change(fn){if(document.startViewTransition)document.startViewTransition(fn);else fn()}
function introNext(){burst(innerWidth/2,innerHeight*.67,8);change(()=>{intro++;render()})}
function start(){const music=document.getElementById("bgMusic");music.volume=.7;music.currentTime=0;music.play().catch(error=>console.log("Music was blocked:",error));change(()=>{page=0;sound=true;render()})}function next(){burst(innerWidth/2,innerHeight*.72,11);change(()=>{page++;render()})}function back(){if(page>0)change(()=>{page--;render()})}function restart(){const music=document.getElementById("bgMusic");music.pause();music.currentTime=0;change(()=>{page=-1;sound=true;render()})}function secret(){let p=document.createElement("div");p.className="popup";p.innerHTML="♥ &nbsp;"+truths[Math.min(page,4)];document.body.appendChild(p);burst(innerWidth/2,58,8);setTimeout(()=>p.remove(),2600)}
function burst(x,y,count=8){for(let i=0;i<count;i++)setTimeout(()=>{let h=document.createElement("span");h.className="float";h.textContent=["♥","♡","✦"][Math.floor(Math.random()*3)];h.style.left=(x+(Math.random()-.5)*110)+"px";h.style.top=(y+(Math.random()-.5)*38)+"px";document.body.appendChild(h);setTimeout(()=>h.remove(),1300)},i*35)}
function render(){if(intro<morningLines.length){const dots=morningLines.map((_,i)=>`<i class="${i===intro?'on':''}"></i>`).join("");screen.innerHTML=`<section class="morning"><div class="morning-mark">${intro===0?'☀':intro===1?'♡':'♥'}</div><div class="morning-dots">${dots}</div><h1>${morningLines[intro]}</h1><button class="morning-next" onclick="introNext()">Next &nbsp;→</button></section>`;return}if(page<0){screen.innerHTML=`<section class="start"><p class="whisper">A tiny story, written for one person.</p><button class="envelope" onclick="start()"><span class="peek">A story of us</span><span class="flap"></span><span class="seal">♥</span><span class="label">For ${HER_NAME}</span></button><p class="hint">Tap the envelope to begin · sound on ♫</p></section>`;return}if(page>=chapters.length){screen.innerHTML=`<button class="sound" onclick="toggleSound()">${sound?'♫':'♩'}</button><section class="card final"><div class="heart">♥</div><p class="eyebrow">No pressure. Just the truth.</p><h1>If your heart is willing too,<br><em>let’s take it one honest step at a time.</em></h1><p class="final-note">Whatever your answer may be, thank you for reading the words I was once too afraid to say.</p><div class="signature"><span>With courage and care,</span><strong>${YOUR_NAME}</strong></div><button class="again" onclick="restart()">Read our story again</button></section>`;return}let c=chapters[page],steps=chapters.map((_,i)=>`<i class="${i<=page?'filled':''}">${i<=page?'♥':'♡'}</i>`).join("");screen.innerHTML=`<button class="sound" onclick="toggleSound()">${sound?'♫':'♩'}</button><section class="card"><header class="header"><span>Our little story</span><button class="secret" onclick="secret()">a tiny secret ♡</button><span>${String(page+1).padStart(2,'0')} / 06</span></header><div class="progress"><span style="width:${(page+1)/6*100}%"></span></div><div class="steps">${steps}</div><div class="content"><p class="eyebrow">${c.e}</p><h1>${c.t}</h1><div class="prose">${c.l.map(x=>`<p>${x}</p>`).join('')}</div></div><footer class="footer"><button class="back" onclick="back()" ${page===0?'disabled':''}>← Back</button><button class="next" onclick="next()">${c.b} &nbsp;→</button></footer></section>`}
document.getElementById("shell").addEventListener("pointerdown",e=>{let h=document.createElement("span");h.className="float";h.textContent=["♥","♡","✦"][Math.floor(Math.random()*3)];h.style.left=e.clientX+"px";h.style.top=e.clientY+"px";document.body.appendChild(h);setTimeout(()=>h.remove(),1300)});render();
