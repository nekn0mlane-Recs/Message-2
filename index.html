<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Letter for You</title>
<style>
:root{--ink:#3d2630;--rose:#a34660}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:#26151d}button{font:inherit}.shell{min-height:100svh;position:relative;overflow:hidden;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -20%,#7e4257 0,#40212d 43%,#211219 100%)}.ambient{position:absolute;border-radius:50%;filter:blur(80px);opacity:.25;pointer-events:none}.a1{width:420px;height:420px;background:#ef8ca5;left:-140px;top:-120px;animation:drift 10s ease-in-out infinite}.a2{width:320px;height:320px;background:#b46d97;right:-90px;bottom:-130px;animation:drift 13s ease-in-out infinite reverse}.stars{position:absolute;inset:0;pointer-events:none}.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe9e6;opacity:.45;animation:twinkle 3s ease-in-out infinite}.stars i:nth-child(3n){width:2px;height:2px;animation-delay:1s}.stars i:nth-child(4n){animation-delay:2s}.orbit{position:absolute;border:1px solid #f7cbd522;border-radius:50%;pointer-events:none;animation:spin 22s linear infinite}.o1{width:78vmin;height:78vmin;left:-36vmin;top:-28vmin}.o2{width:62vmin;height:62vmin;right:-25vmin;bottom:-25vmin;animation-direction:reverse}.orbit span{position:absolute;color:#f7cbd599;text-shadow:0 0 18px #ef95ab;font-size:28px;right:8%;top:28%}.start{z-index:2;text-align:center;color:#fcebed;animation:up .9s ease both}.whisper{text-transform:uppercase;letter-spacing:.28em;font:600 11px/1.5 Arial,sans-serif;opacity:.7;margin:0 0 48px}.envelope{width:min(330px,78vw);aspect-ratio:1.55;position:relative;border:0;cursor:pointer;background:linear-gradient(145deg,#f6d9d8,#e9b8c0);box-shadow:0 30px 80px #160b10aa;transition:.35s}.envelope:hover{transform:translateY(-8px) rotate(-1deg)}.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(32deg,transparent 49.5%,#f0c8cd 50%) left/50% 100% no-repeat,linear-gradient(-32deg,transparent 49.5%,#efc4cb 50%) right/50% 100% no-repeat}.flap{position:absolute;z-index:2;inset:0 0 auto;height:58%;background:#f8dddc;clip-path:polygon(0 0,100% 0,50% 100%)}.peek{position:absolute;z-index:-1;left:9%;right:9%;height:80%;top:-14%;padding-top:14px;background:#fffaf7;color:#9e6070;font-style:italic;transition:.5s}.envelope:hover .peek{transform:translateY(-20px)}.seal{position:absolute;z-index:3;left:50%;top:48%;translate:-50% -50%;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;color:#ffe8e6;background:linear-gradient(145deg,#b9556d,#7f3048);box-shadow:0 6px 18px #762e45aa;font-size:20px}.label{position:absolute;z-index:3;left:0;right:0;bottom:22px;color:#744052;font-style:italic;font-size:17px}.hint{margin-top:30px;font:500 12px Arial,sans-serif;letter-spacing:.08em;opacity:.65;animation:pulse 2s infinite}.card{z-index:2;width:min(760px,100%);min-height:min(650px,calc(100svh - 48px));padding:34px 46px;background:linear-gradient(145deg,#fffdfb,#faeeeb);border:1px solid #fff8;box-shadow:0 38px 110px #14090f99;position:relative;display:flex;flex-direction:column;animation:up .6s ease}.card:before{content:"";position:absolute;inset:11px;border:1px solid #a3466030;pointer-events:none}.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font:700 10px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#9c6978}.header span:last-child{text-align:right}.secret{border:0;border-bottom:1px dashed #b8798b;background:transparent;color:#a34660;cursor:pointer;font:italic 12px Georgia,serif;text-transform:none;letter-spacing:.03em}.progress{margin-top:18px;height:2px;background:#e7ced2}.progress span{display:block;height:100%;background:linear-gradient(90deg,#a34660,#e0879f);box-shadow:0 0 10px #d96f8c;transition:width .7s}.steps{display:flex;justify-content:center;gap:10px;margin-top:12px;color:#d7aeb8;font-size:10px}.steps i{font-style:normal}.steps .filled{color:#b44965;transform:scale(1.25)}.content{margin:auto 0;padding:45px 4%}.eyebrow{font:700 11px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin:0 0 20px}h1{font-size:clamp(36px,6vw,62px);font-weight:400;line-height:1.04;letter-spacing:-.035em;margin:0}h1:after{content:"";display:block;width:44px;height:2px;background:var(--rose);margin:28px 0}h1 em{color:var(--rose);font-weight:400}.prose p,.final-note{font-size:clamp(16px,2.2vw,19px);line-height:1.75;color:#644955;margin:0 0 14px}.footer{display:flex;align-items:center;justify-content:space-between;gap:18px}.next{border:0;color:white;background:var(--rose);padding:15px 22px;cursor:pointer;font:700 12px Arial,sans-serif;letter-spacing:.06em}.back,.again{border:0;background:transparent;color:#8c6672;cursor:pointer;font:600 12px Arial,sans-serif}.back:disabled{opacity:.25}.final{text-align:center;align-items:center;justify-content:center}.final h1:after{margin:28px auto}.heart{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;margin-bottom:28px;background:#f4d5d9;color:var(--rose);font-size:28px;animation:beat 1.8s infinite}.signature{display:flex;flex-direction:column;gap:6px;margin:20px 0 30px;font-style:italic;color:#80606a}.signature strong{font-size:21px;color:var(--rose)}.popup{position:fixed;z-index:30;left:50%;top:18px;translate:-50%;width:max-content;max-width:calc(100vw - 32px);padding:13px 19px;border:1px solid #f8d9df;background:#fff9f5ee;box-shadow:0 15px 45px #160a1266;color:#68404d;font-style:italic;animation:pop .4s both}.float{position:fixed;z-index:20;pointer-events:none;color:#f0a0b5;font-size:18px;translate:-50% -50%;animation:float 1.25s forwards}.sound{position:fixed;z-index:12;right:18px;top:18px;width:42px;height:42px;border:1px solid #f5d5dc55;border-radius:50%;background:#3a1b27aa;color:#f6d9df;cursor:pointer;font-size:18px}@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:translateY(-20px) scale(.9)}}@keyframes float{0%{opacity:0;transform:scale(.4)}20%{opacity:1}100%{opacity:0;transform:translateY(-85px) scale(1.4) rotate(18deg)}}@keyframes beat{12%{transform:scale(1.13)}24%{transform:scale(1)}}@keyframes pulse{50%{opacity:1}}@keyframes twinkle{50%{opacity:.1}}@keyframes drift{50%{transform:translate(30px,20px)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:600px){.shell{padding:12px}.card{min-height:calc(100svh - 24px);padding:27px 25px}.content{padding:35px 0}.header{grid-template-columns:1fr auto}.secret{grid-row:2;grid-column:1/3;margin-top:10px}.next{max-width:70%}.popup{top:70px}}
</style>
</head>
<body><main class="shell" id="shell"><div class="ambient a1"></div><div class="ambient a2"></div><div class="orbit o1"><span>♥</span></div><div class="orbit o2"><span>♡</span></div><div class="stars" id="stars"></div><div id="screen"></div></main>
<script>
// EDIT ONLY THESE TWO NAMES:
const HER_NAME="Riza, my Favorite Vice";
const YOUR_NAME="Recs, your lover boy";
const chapters=[
{e:"Before anything else",t:`Hey, ${HER_NAME}…`,l:["I made this because some feelings deserve more than a hurried message.","There is something I have been trying to say—honestly, gently, and without hiding behind fear."],b:"Walk with me"},
{e:"Chapter one · Us",t:"Somewhere along the way…",l:["Our ordinary conversations stopped feeling ordinary to me.","Your presence became something I looked forward to. Your happiness began to matter to me. And without planning it, the word ‘us’ started living quietly in my thoughts."],b:"There’s more"},
{e:"Chapter two · The quiet truth",t:"I know you’ve been wondering.",l:["You may be asking what is happening between us. The truth is, I have been wondering too—probably more than I know how to explain.","If I sometimes seem uncertain or distant, it is not because I do not want you. It is because what I feel is real enough to scare me."],b:"Let me be honest"},
{e:"Chapter three · The scary part",t:"Yes, I am afraid.",l:["I am scared of making mistakes. I am scared that I will not always know the right thing to say or do.","Commitment means placing something precious in another person’s hands. It means being vulnerable—and that is something I am still learning how to do."],b:"But fear isn’t the ending"},
{e:"Chapter four · My choice",t:"Even with that fear, I am willing.",l:["I am willing to try. To communicate. To grow with you.","I am willing to choose you—not only when everything feels exciting and easy, but also when things become confusing, uncertain, or difficult.","I cannot promise perfection. But I can promise honesty, effort, and that I will never treat your feelings like a game."],b:"One last page"},
{e:"The page I hope we write together",t:"So, what is happening to us?",l:["Maybe we are standing at the beginning of something beautiful.","I am scared—but I am here. I am uncertain—but I am sincere. And if you will let me, I want to discover where this ‘us’ can go.","You do not need to answer everything today. I only want you to know that you matter to me—more than you probably realize."],b:"Open my heart"}];
const truths=["You make ordinary moments feel special.","This part took courage to write.","No games. Only honesty.","Still here. Still choosing courage.","This is what my heart has been trying to say."];let page=-1,sound=true;
const screen=document.getElementById("screen");document.getElementById("stars").innerHTML="<i></i>".repeat(22);document.querySelectorAll(".stars i").forEach((s,i)=>{s.style.left=(5+(i*37)%91)+"%";s.style.top=(7+(i*53)%87)+"%"});
function chime(n=523){if(!sound)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A,o=c.createOscillator(),g=c.createGain();o.frequency.value=n;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.05,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.5);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.52)}
function start(){page=0;chime(440);render()}function next(){chime(523+page*28);page++;render()}function back(){if(page>0)page--;render()}function restart(){page=-1;render()}function secret(){let p=document.createElement("div");p.className="popup";p.innerHTML="♥ &nbsp;"+truths[Math.min(page,4)];document.body.appendChild(p);chime(659);setTimeout(()=>p.remove(),2600)}
function render(){if(page<0){screen.innerHTML=`<section class="start"><p class="whisper">A tiny story, written for one person.</p><button class="envelope" onclick="start()"><span class="peek">A story of us</span><span class="flap"></span><span class="seal">♥</span><span class="label">For ${HER_NAME}</span></button><p class="hint">Tap the envelope to begin</p></section>`;return}if(page>=chapters.length){screen.innerHTML=`<button class="sound" onclick="sound=!sound;this.textContent=sound?'♫':'♩'">${sound?'♫':'♩'}</button><section class="card final"><div class="heart">♥</div><p class="eyebrow">No pressure. Just the truth.</p><h1>If your heart is willing too,<br><em>let’s take it one honest step at a time.</em></h1><p class="final-note">Whatever your answer may be, thank you for reading the words I was once too afraid to say.</p><div class="signature"><span>With courage and care,</span><strong>${YOUR_NAME}</strong></div><button class="again" onclick="restart()">Read our story again</button></section>`;return}let c=chapters[page],steps=chapters.map((_,i)=>`<i class="${i<=page?'filled':''}">${i<=page?'♥':'♡'}</i>`).join("");screen.innerHTML=`<button class="sound" onclick="sound=!sound;this.textContent=sound?'♫':'♩'">${sound?'♫':'♩'}</button><section class="card"><header class="header"><span>Our little story</span><button class="secret" onclick="secret()">a tiny secret ♡</button><span>${String(page+1).padStart(2,'0')} / 06</span></header><div class="progress"><span style="width:${(page+1)/6*100}%"></span></div><div class="steps">${steps}</div><div class="content"><p class="eyebrow">${c.e}</p><h1>${c.t}</h1><div class="prose">${c.l.map(x=>`<p>${x}</p>`).join('')}</div></div><footer class="footer"><button class="back" onclick="back()" ${page===0?'disabled':''}>← Back</button><button class="next" onclick="next()">${c.b} &nbsp;→</button></footer></section>`}
document.getElementById("shell").addEventListener("pointerdown",e=>{let h=document.createElement("span");h.className="float";h.textContent=["♥","♡","✦"][Math.floor(Math.random()*3)];h.style.left=e.clientX+"px";h.style.top=e.clientY+"px";document.body.appendChild(h);setTimeout(()=>h.remove(),1300)});render();
</script></body></html>
